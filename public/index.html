<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meeting Lookup — Calendly</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f5f5f4; margin:0; padding:24px; color:#222; }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .sub { color:#666; font-size:13px; margin-bottom:20px; }
  .search-box { background:#fff; border:1px solid #e2e2e0; border-radius:10px; padding:18px; margin-bottom:20px; }
  .search-box label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
  .search-row { display:flex; gap:8px; }
  .search-row input { flex:1; padding:10px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; box-sizing:border-box; }
  button { background:#1a1a1a; color:#fff; border:none; padding:10px 18px; border-radius:6px; font-size:13px; cursor:pointer; }
  button:hover { background:#333; }
  button:disabled { background:#999; cursor:not-allowed; }
  .error { color:#b00020; font-size:13px; margin-top:10px; }
  .loading { color:#666; font-size:13px; margin-top:10px; }
  .hidden { display:none; }
  .summary { font-size:13px; color:#555; margin-bottom:14px; }
  .session-card { background:#fff; border:1px solid #e2e2e0; border-radius:10px; padding:18px; margin-bottom:14px; }
  .session-card .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .session-card .type { font-size:15px; font-weight:600; }
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
  .badge.active { background:#e3f5e6; color:#1a7d33; }
  .badge.canceled { background:#fdeaea; color:#b00020; }
  .detail-grid { display:grid; grid-template-columns: 140px 1fr; gap:6px 12px; font-size:13px; margin-top:8px; }
  .detail-grid .k { color:#888; }
  .detail-grid .v { color:#222; }
  .qa { margin-top:12px; padding-top:12px; border-top:1px solid #f0f0f0; }
  .qa-item { font-size:13px; margin-bottom:8px; }
  .qa-item .q { color:#888; }
  .qa-item .a { color:#222; font-weight:500; }
  .empty { color:#888; font-size:13px; text-align:center; padding:30px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>Meeting Lookup — Calendly</h1>
  <div class="sub">Enter a contributor's email to see all their sessions (First Interview, Onboarding Call, etc.) with full details</div>

  <div class="search-box">
    <label>Contributor email</label>
    <div class="search-row">
      <input type="text" id="emailInput" placeholder="name@example.com" />
      <button id="searchBtn">Search</button>
    </div>
    <div class="error hidden" id="errBox"></div>
    <div class="loading hidden" id="loadingBox">Searching meetings...</div>
  </div>

  <div id="results"></div>
</div>

<script>
let cachedEvents = null;

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}
function fmtDuration(start, end) {
  if (!end) return '—';
  const mins = Math.round((new Date(end) - new Date(start)) / 60000);
  return mins + ' min';
}

async function loadAllEvents() {
  const res = await fetch('/api/events');
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error loading meetings.');
  return data.events;
}

function renderSessionCard(e) {
  const qaHtml = (e.questionsAndAnswers && e.questionsAndAnswers.length > 0)
    ? `<div class="qa">${e.questionsAndAnswers.map(qa => `
        <div class="qa-item">
          <div class="q">${qa.question}</div>
          <div class="a">${qa.answer || '—'}</div>
        </div>
      `).join('')}</div>`
    : '';

  return `
    <div class="session-card">
      <div class="top">
        <div class="type">${e.type}</div>
        <span class="badge ${e.status === 'active' ? 'active' : 'canceled'}">${e.status === 'active' ? 'Active' : 'Canceled'}</span>
      </div>
      <div class="detail-grid">
        <div class="k">Invitee</div><div class="v">${e.invitee}</div>
        <div class="k">Email</div><div class="v">${e.email || '—'}</div>
        <div class="k">Interviewer</div><div class="v">${e.hosts && e.hosts.length > 0 ? e.hosts.join(', ') : '—'}</div>
        <div class="k">Date</div><div class="v">${fmtDate(e.start)}</div>
        <div class="k">Time</div><div class="v">${fmtTime(e.start)} (${e.timezone || 'timezone not specified'})</div>
        <div class="k">Duration</div><div class="v">${fmtDuration(e.start, e.end)}</div>
        <div class="k">Location</div><div class="v">${e.location || '—'}</div>
        ${e.textReminderNumber ? `<div class="k">Phone</div><div class="v">${e.textReminderNumber}</div>` : ''}
        ${e.rescheduled ? `<div class="k">Rescheduled</div><div class="v">Yes</div>` : ''}
        ${e.status !== 'active' && e.cancelReason ? `<div class="k">Cancel reason</div><div class="v">${e.cancelReason}</div>` : ''}
        <div class="k">Booked on</div><div class="v">${fmtDate(e.createdAt)}</div>
      </div>
      ${qaHtml}
    </div>
  `;
}

async function runSearch() {
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  const errBox = document.getElementById('errBox');
  const loadingBox = document.getElementById('loadingBox');
  const results = document.getElementById('results');
  const searchBtn = document.getElementById('searchBtn');

  errBox.classList.add('hidden');
  results.innerHTML = '';

  if (!email) {
    errBox.textContent = 'Enter an email to search.';
    errBox.classList.remove('hidden');
    return;
  }

  searchBtn.disabled = true;
  loadingBox.classList.remove('hidden');

  try {
    if (!cachedEvents) {
      cachedEvents = await loadAllEvents();
    }
    const matches = cachedEvents.filter(e => e.email.toLowerCase() === email || e.email.toLowerCase().includes(email));

    if (matches.length === 0) {
      results.innerHTML = '<div class="empty">No meetings found for that email.</div>';
    } else {
      matches.sort((a, b) => new Date(b.start) - new Date(a.start));
      results.innerHTML = `
        <div class="summary">${matches.length} session${matches.length > 1 ? 's' : ''} found for <strong>${email}</strong></div>
        ${matches.map(renderSessionCard).join('')}
      `;
    }
  } catch (e) {
    errBox.textContent = e.message;
    errBox.classList.remove('hidden');
  } finally {
    searchBtn.disabled = false;
    loadingBox.classList.add('hidden');
  }
}

document.getElementById('searchBtn').addEventListener('click', runSearch);
document.getElementById('emailInput').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') runSearch();
});
</script>
</body>
</html>
